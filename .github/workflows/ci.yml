name: CI Pipeline

on:
  push:
    branches:
      - main
      - "day_*"
  pull_request:
    branches:
      - main
      - "day_*"

jobs:
  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short
